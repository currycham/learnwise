{% extends "base.html" %}
{% block title %}登录 · LearnWise{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block body %}
<div class="card" style="margin-top:20px">
  <h1 style="font-size:24px;margin-bottom:6px">登录 / 注册</h1>
  <p class="muted small" style="margin:0 0 16px">用邮箱收验证码，不用记密码。第一次登录就是注册。</p>
  <form id="f1">
    <input class="input" id="email" type="email" placeholder="邮箱" required autocomplete="email">
    {% if need_invite %}<input class="input" id="invite" placeholder="邀请码（内测期间新用户需要，老用户不用填）" style="margin-top:10px">{% endif %}
    <div class="row" style="margin-top:12px"><button class="btn" id="b1" type="submit">发送验证码</button></div>
  </form>
  <form id="f2" style="display:none;margin-top:16px">
    <p class="small muted" style="margin:0 0 8px">验证码已发到 <b id="to"></b>，10 分钟内有效（没收到的话看看垃圾邮件）。</p>
    <input class="input" id="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" required>
    <div class="row" style="margin-top:12px"><button class="btn" id="b2" type="submit">登录</button></div>
  </form>
  <p class="err" id="err"></p>
</div>
{% endblock %}
{% block script %}<script>
const $ = id => document.getElementById(id), err = $('err');
$('f1').onsubmit = async e => {
  e.preventDefault(); err.textContent = ''; $('b1').disabled = true;
  try {
    await api('/api/login/code', { email: $('email').value, invite: $('invite')?.value || '' });
    $('to').textContent = $('email').value; $('f2').style.display = 'block'; $('code').focus(); $('b1').textContent = '重新发送';
  } catch (x) { err.textContent = x.message; }
  setTimeout(() => $('b1').disabled = false, 3000);
};
$('f2').onsubmit = async e => {
  e.preventDefault(); err.textContent = ''; $('b2').disabled = true;
  try { await api('/api/login/verify', { email: $('email').value, code: $('code').value }); location.href = {{ next|tojson }}; }
  catch (x) { err.textContent = x.message; $('b2').disabled = false; }
};
</script>{% endblock %}
